spring.application.name=ej_inventado
app.base-url=${APP_BASE_URL:http://localhost:8080}

# ==========================================
# Producción / Errores (nunca exponer detalles)
# ==========================================
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# ==========================================
# OAuth2 - Google
# Obtener credenciales en: https://console.cloud.google.com
# Redirect URI local: http://localhost:8080/login/oauth2/code/google
# ==========================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:google-no-configurado}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:google-no-configurado}
spring.security.oauth2.client.registration.google.scope=profile,email

# ==========================================
# OAuth2 - GitHub
# Obtener credenciales en: https://github.com/settings/developers
# Redirect URI local: http://localhost:8080/login/oauth2/code/github
# ==========================================
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:github-no-configurado}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:github-no-configurado}
spring.security.oauth2.client.registration.github.scope=user:email,read:user

# ==========================================
# Base de Datos - MySQL Local
# Arrancar con: docker-compose up -d
# ==========================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/triping_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:toor}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate y JPA
# En VPS: DDL_AUTO=validate (nunca 'update' en producción)
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ==========================================
# Imágenes - Cloudinary
# ==========================================
cloudinary.cloud_name=${CLOUDINARY_NAME:dfi3bfjn0}
cloudinary.api_key=${CLOUDINARY_API_KEY:161727747539232}
cloudinary.api_secret=${CLOUDINARY_API_SECRET:IlY4F1Eqa1lqL18_-kLmEpu_8Ys}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ==========================================
# Swagger / OpenAPI
# ==========================================
springdoc.packages-to-scan=com.example.ej_inventado.Controllers
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha

# ==========================================
# Internacionalización
# ==========================================
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# ==========================================
# Sesión y Seguridad
# En VPS con HTTPS: COOKIE_SECURE=true
# ==========================================
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# ==========================================
# Hikari - Pool de Conexiones
# ==========================================
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# ==========================================
# Email - Gmail SMTP
# Necesitas una "Contraseña de aplicación" de Google:
# Google Account → Seguridad → Verificación en 2 pasos → Contraseñas de aplicación
# ==========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
# En VPS: configurar GMAIL_USER y GMAIL_APP_PASSWORD como variables de entorno
spring.mail.username=${GMAIL_USER:}
spring.mail.password=${GMAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
