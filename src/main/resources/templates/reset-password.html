<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styleGlobal.css}">
    <link rel="stylesheet" th:href="@{/css/styleIndex.css}">
    <title>TriPing | Restablecer contraseña</title>
</head>
<body>
<div class="overlay" style="background:linear-gradient(135deg,#012d30 0%,var(--c-dark) 100%);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px">

    <a th:href="@{/}" style="text-decoration:none;margin-bottom:32px">
        <div style="color:var(--c-mint);font-size:1.5rem;font-weight:800">🌍 TriPing</div>
    </a>

    <div style="background:var(--c-surface);border-radius:var(--rad-xl);padding:40px 36px;max-width:420px;width:100%;box-shadow:var(--shadow-xl)">

        <!-- Error: token inválido o caducado (sin token en model) -->
        <div th:if="${error != null and token == null}" style="text-align:center">
            <div style="font-size:2.5rem;margin-bottom:12px">⚠️</div>
            <h1 style="font-size:1.3rem;font-weight:800;color:var(--c-dark);margin-bottom:10px">Enlace no válido</h1>
            <p style="color:var(--c-muted);font-size:.9rem;margin-bottom:20px" th:text="${error}">Error</p>
            <a th:href="@{/recuperar-password}" class="btn btn-primary btn-full">Solicitar nuevo enlace →</a>
        </div>

        <!-- Formulario de nueva contraseña -->
        <div th:if="${token != null}">
            <div style="text-align:center;margin-bottom:24px">
                <div style="font-size:2.5rem;margin-bottom:8px">🔒</div>
                <h1 style="font-size:1.4rem;font-weight:800;color:var(--c-dark);margin-bottom:6px">Nueva contraseña</h1>
                <p style="color:var(--c-muted);font-size:.875rem">Elige una contraseña segura para tu cuenta.</p>
            </div>

            <div th:if="${error}" class="alert alert-error" style="margin-bottom:16px">
                ⚠️ <span th:text="${error}">Error</span>
            </div>

            <form th:action="@{/reset-password}" method="post" novalidate>
                <input type="hidden" name="token" th:value="${token}">

                <div class="field">
                    <label for="password">Nueva contraseña</label>
                    <div class="input-row">
                        <input id="password" type="password" name="password"
                               required minlength="8"
                               placeholder="Mínimo 8 caracteres"
                               oninput="evalStrength(this.value)">
                        <button type="button" class="eye-btn" onclick="togglePwd('password',this)">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                    <div class="strength-wrap">
                        <div class="strength-bar"><div id="strength-fill" class="strength-fill"></div></div>
                        <span id="strength-lbl" class="strength-lbl"></span>
                    </div>
                </div>

                <div class="field">
                    <label for="confirmPassword">Confirmar contraseña</label>
                    <div class="input-row">
                        <input id="confirmPassword" type="password" name="confirmPassword"
                               required placeholder="Repite la contraseña"
                               oninput="evalMatch()">
                        <button type="button" class="eye-btn" onclick="togglePwd('confirmPassword',this)">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                    <span id="match-lbl" class="match-lbl"></span>
                </div>

                <button type="submit" class="btn btn-primary btn-full btn-lg"
                        onclick="return clientValidate()">
                    Guardar nueva contraseña →
                </button>
            </form>
        </div>

    </div>

</div>

<script>
function togglePwd(id, btn) {
    const inp = document.getElementById(id);
    inp.type = inp.type === 'password' ? 'text' : 'password';
    btn.classList.toggle('active', inp.type === 'text');
}
const STRENGTH = [
    {lbl:'Muy débil',cls:'w-20 s-danger'},{lbl:'Débil',cls:'w-40 s-warning'},
    {lbl:'Aceptable',cls:'w-60 s-info'},{lbl:'Fuerte',cls:'w-80 s-success'},{lbl:'¡Excelente!',cls:'w-100 s-success'}
];
function evalStrength(v) {
    let s = 0;
    if (v.length >= 8) s++; if (/[a-z]/.test(v)) s++; if (/[A-Z]/.test(v)) s++;
    if (/[0-9]/.test(v)) s++; if (/[^a-zA-Z0-9]/.test(v)) s++;
    const idx = v.length === 0 ? -1 : Math.min(s - 1, 4);
    document.getElementById('strength-fill').className = 'strength-fill ' + (idx >= 0 ? STRENGTH[idx].cls : '');
    document.getElementById('strength-lbl').textContent = idx >= 0 ? STRENGTH[idx].lbl : '';
}
function evalMatch() {
    const pw = document.getElementById('password').value;
    const cpw = document.getElementById('confirmPassword').value;
    const lbl = document.getElementById('match-lbl');
    if (!cpw) { lbl.textContent = ''; return; }
    lbl.textContent = pw === cpw ? '✓ Coinciden' : '✗ No coinciden';
    lbl.className = 'match-lbl ' + (pw === cpw ? 's-success' : 's-danger');
}
function clientValidate() {
    const pw = document.getElementById('password').value;
    const cpw = document.getElementById('confirmPassword').value;
    if (pw.length < 8) { alert('Mínimo 8 caracteres.'); return false; }
    if (pw !== cpw) { alert('Las contraseñas no coinciden.'); return false; }
    return true;
}
</script>
</body>
</html>
