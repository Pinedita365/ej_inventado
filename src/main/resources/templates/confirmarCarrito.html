<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styleGlobal.css}">
    <link rel="stylesheet" th:href="@{/css/styleFooter.css}">
    <link rel="stylesheet" th:href="@{/css/styleConfirmarCarrito.css}">
    <title>TriPing | Confirmar selección</title>
</head>
<body class="cc-body">

<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<!-- ══ PROGRESO ════════════════════════════════════════════════════════ -->
<div class="cc-progress">
    <div class="cc-progress__inner">
        <div class="cc-step cc-step--done">1 · Elegir actividades</div>
        <div class="cc-step__arrow">→</div>
        <div class="cc-step cc-step--active">2 · Confirmar</div>
        <div class="cc-step__arrow">→</div>
        <div class="cc-step">3 · Planificar días</div>
        <div class="cc-step__arrow">→</div>
        <div class="cc-step">4 · Itinerario</div>
    </div>
</div>

<!-- ══ CONTENIDO ═══════════════════════════════════════════════════════ -->
<main class="cc-main">

    <!-- Cabecera del viaje -->
    <div class="cc-trip-header">
        <div class="cc-trip-info">
            <h1>Tu selección para <strong th:text="${session.ciudad}">la ciudad</strong></h1>
            <p>
                📅 Del <span th:text="${session.fEntrada}"></span> al <span th:text="${session.fSalida}"></span>
                · <strong th:text="${session.diasViaje} + ' días'"></strong>
                · <strong th:text="${session.cont} + ' actividades'"></strong>
                · <strong th:text="${session.precioCarro} + ' €'"></strong> total
            </p>
        </div>
    </div>

    <!-- Grid de actividades del carrito -->
    <div class="cc-grid">
        <article th:each="act : ${session.carrito}" class="cc-card">
            <div class="cc-card__img">
                <img th:src="@{${act.img}}" th:alt="${act.nombre}">
                <span class="cc-card__badge"
                      th:classappend="${act.tipo.name() == 'DEPORTIVA'} ? ' badge-deportiva' :
                                     (${act.tipo.name() == 'TURISTICA'} ? ' badge-turistica' : ' badge-gastronomica')"
                      th:text="${act.tipo.name() == 'DEPORTIVA'} ? '🏃 Deportiva' :
                               (${act.tipo.name() == 'TURISTICA'} ? '🏛️ Turística' : '🍽️ Gastronómica')">
                </span>
            </div>
            <div class="cc-card__body">
                <h3 th:text="${act.nombre}">Nombre</h3>
                <p class="cc-card__desc" th:text="${act.descripcion}">Descripción</p>
                <div class="cc-card__meta">
                    <span>📍 <span th:text="${act.ciudad}"></span></span>
                    <span>⏱️ <span th:text="${act.duracion}"></span> min</span>
                    <span class="cc-card__price"
                          th:text="${act.precio > 0} ? ${act.precio} + ' €' : 'Gratis'">0€</span>
                </div>
            </div>
        </article>
    </div>

    <!-- Resumen y CTA -->
    <div class="cc-footer-bar">
        <div class="cc-footer-bar__total">
            <span class="cc-footer-bar__label">Total estimado</span>
            <span class="cc-footer-bar__amount" th:text="${session.precioCarro} + ' €'">0 €</span>
        </div>
        <div class="cc-footer-bar__actions">
            <a th:href="@{/inicio}" class="btn btn-outline">← Cambiar selección</a>
            <form action="planificar" method="get" style="display:inline">
                <button type="submit" class="btn btn-accent btn-lg">
                    Planificar por días →
                </button>
            </form>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
